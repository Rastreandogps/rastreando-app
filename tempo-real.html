<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Rastreando GPS</title>
<script>
try{var t=localStorage.getItem('tema');if(t==='claro'||t==='escuro'){document.documentElement.setAttribute('data-tema',t)}}catch(e){}
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#0f1115;--card:#171a20;--card2:#1f232b;--line:#2a2f39;
  --txt:#f2f4f7;--mut:#9aa3b2;--red:#e3262f;--red2:#ff4a52;
  --cyan:#38e1e6;--green:#33d17a;--amber:#f5b83d;
}
:root[data-tema="claro"]{
  --bg:#f4f6f9;--card:#ffffff;--card2:#eef1f5;--line:#d9dee6;
  --txt:#14181f;--mut:#5d6675;--red:#d81f28;--red2:#d81f28;
  --cyan:#0a8f95;--green:#1a9e57;--amber:#b87800;
}
:root[data-tema="claro"] #map{background:#e8ecf0}
:root[data-tema="claro"] .leaflet-tile-pane{filter:none}
:root[data-tema="claro"] .leaflet-control-attribution{background:rgba(255,255,255,.8)!important}
:root[data-tema="claro"] .carlabel{background:rgba(255,255,255,.92)}
:root[data-tema="claro"] .sheet{box-shadow:0 -8px 24px rgba(0,0,0,.15)}
:root[data-tema="claro"] .chk input:checked + .box::after{border-color:#fff}
:root[data-tema="claro"] .modal{background:rgba(0,0,0,.4)}
.tema{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
.tema svg{width:18px;height:18px;stroke:var(--txt);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tema .sol{display:none}
:root[data-tema="claro"] .tema .sol{display:block}
:root[data-tema="claro"] .tema .lua{display:none}
.demo.ok{color:var(--green);border-color:rgba(51,209,122,.4)}
.login{display:none;position:fixed;inset:0;z-index:2000;background:var(--bg);align-items:center;justify-content:center;padding:24px}
.login.show{display:flex}
.lbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
.lbrand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:10px;text-align:center}
.lbrand img{width:72px;height:72px;border-radius:50%;object-fit:cover}
.lbrand b{font-size:20px;letter-spacing:.06em}
.lbrand span{font-size:13px;color:var(--mut)}
.lbox input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 14px;font:inherit;font-size:16px;outline:none}
.lbox input:focus{border-color:var(--cyan)}
.lerr{min-height:18px;font-size:13px;color:var(--red2);font-weight:600;text-align:center}
.hdir{display:flex;align-items:center;gap:8px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* Topo */
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--bg);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.brand .pin{width:34px;height:34px;border-radius:50%;border:2px solid var(--red);display:none;align-items:center;justify-content:center;box-shadow:0 0 10px rgba(227,38,47,.45)}
.brand .name{font-weight:800;letter-spacing:.06em;font-size:15px;line-height:1}
.brand .name small{display:block;font-weight:600;letter-spacing:.3em;font-size:10px;color:var(--mut);margin-top:3px}
.demo{font-size:10px;font-weight:700;color:var(--amber);border:1px solid rgba(245,184,61,.4);border-radius:20px;padding:4px 8px;white-space:nowrap}

/* Mapa */
main{position:relative;flex:1;min-height:0;overflow:hidden}
#map{position:absolute;inset:0;background:#1a1d22}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.92) saturate(.55)}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{background:rgba(15,17,21,.7)!important;color:var(--mut)!important;font-size:9px}
.leaflet-control-attribution a{color:var(--mut)!important}
.car{width:44px;height:44px;transition:transform .25s linear}
.car.off{filter:grayscale(1) brightness(.8)}
.carlabel{position:absolute;top:46px;left:50%;transform:translateX(-50%);background:rgba(15,17,21,.85);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:11px;white-space:nowrap;color:var(--txt)}

/* Botão Seguir */
.follow{position:absolute;top:14px;right:14px;z-index:400;height:40px;padding:0 14px 0 12px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.follow svg{stroke:currentColor}
.follow.active{border-color:var(--cyan);background:rgba(56,225,230,.12);color:var(--cyan)}

/* Aviso sem veículo */
.vazio{display:none;position:absolute;left:16px;right:16px;bottom:24px;z-index:450;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:center;font-weight:600}
.vazio small{display:block;font-weight:400;color:var(--mut);margin-top:4px}

/* Cartão do veículo (arrastável) */
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:450;margin:0 auto;max-width:520px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:0 16px 14px;box-shadow:0 -8px 24px rgba(0,0,0,.45);transition:transform .22s ease;will-change:transform}
.sheet.drag{transition:none}
.dragzone{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.handlewrap{padding:10px 0 12px}
.handle{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vname{font-size:18px;font-weight:700}
.plate{font-size:12px;color:var(--mut);letter-spacing:.08em;margin-top:2px}
.status{font-size:12px;font-weight:700;padding:5px 10px;border-radius:20px;white-space:nowrap}
.status.sm{font-size:11px;padding:4px 8px}
.st-move{background:rgba(51,209,122,.14);color:var(--green)}
.st-stop{background:rgba(56,225,230,.12);color:var(--cyan)}
.st-off{background:rgba(154,163,178,.14);color:var(--mut)}
.st-block{background:rgba(227,38,47,.16);color:var(--red2)}
.banner{display:none;margin-top:12px;padding:9px 12px;border-radius:10px;background:rgba(227,38,47,.12);border:1px solid rgba(227,38,47,.35);color:var(--red2);font-size:13px;font-weight:600}
.banner.show{display:block}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 12px}
.stat{background:var(--card2);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:16px;margin-top:4px}
.stat span{font-size:11px;color:var(--mut)}
.addr{font-size:13px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;margin-bottom:12px}
.addr strong{color:var(--txt);font-weight:600}
.actions{display:grid;grid-template-columns:1fr 1fr 52px;gap:8px}
.btn{height:48px;border-radius:12px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px}
.actions.dois{grid-template-columns:1fr 1fr;margin-top:8px}
.btn-red{background:var(--red);color:#fff}
.btn-red:active{background:#c51f27}
.btn-out{border:1px solid var(--line);background:var(--card2)}
.btn[disabled]{opacity:.45;cursor:default}

/* Aba Veículos */
.vview{position:absolute;inset:0;z-index:600;background:var(--bg);display:none;flex-direction:column}
.vview.show{display:flex}
.vtop{padding:16px 16px 8px}
.vtitle{display:flex;align-items:center;justify-content:space-between;gap:10px}
.vtitle h2{font-size:20px}
.linkbtn{color:var(--cyan);font-size:14px;font-weight:600;padding:8px 0}
.vcount{font-size:13px;color:var(--mut);margin-top:2px}
.search{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--txt);padding:0 14px;font:inherit;font-size:15px;margin-top:12px;outline:none}
.search:focus{border-color:var(--cyan)}
.vlist{flex:1;overflow-y:auto;padding:4px 16px 16px}
.vrow{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.chk{position:relative;display:flex;align-items:center;justify-content:center;width:48px;height:58px;cursor:pointer;flex:none}
.chk input{position:absolute;opacity:0;width:0;height:0}
.box{width:22px;height:22px;border-radius:6px;border:2px solid var(--mut);display:flex;align-items:center;justify-content:center}
.chk input:checked + .box{background:var(--cyan);border-color:var(--cyan)}
.chk input:checked + .box::after{content:"";width:6px;height:11px;border:solid #0f1115;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chk input:focus-visible + .box{outline:2px solid var(--cyan);outline-offset:2px}
.vinfo{flex:1;min-width:0;text-align:left;padding:10px 0}
.vn{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vp{font-size:12px;color:var(--mut);letter-spacing:.08em;margin-top:2px}
.vempty{padding:24px 0;text-align:center;color:var(--mut);font-size:14px}

/* Navegação */
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
nav button.on{color:var(--txt)}
nav button.on svg{stroke:var(--red2)}
nav svg{width:22px;height:22px;stroke:var(--mut);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Janelas */
.modal{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.box2{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.box2 h3{font-size:18px;margin-bottom:8px}
.box2 p{font-size:14px;color:var(--mut);line-height:1.45;margin-bottom:12px}
.warn{background:rgba(245,184,61,.1);border:1px solid rgba(245,184,61,.35);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px;display:none}
.warn.show{display:block}
.box2 .actions2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.opts{display:flex;gap:8px;margin-bottom:12px}
.opt{flex:1;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-size:14px}
.opt.sel{border-color:var(--cyan);color:var(--cyan)}
.link{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13px;word-break:break-all;margin-bottom:12px;color:var(--txt)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:1100;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 16px;font-size:14px;max-width:calc(100% - 32px);text-align:center;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<header>
  <div class="brand">
    <img src="logo.jpeg" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="pin">
      <svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0C3.6 0 0 3.5 0 7.9 0 13.5 8 20 8 20s8-6.5 8-12.1C16 3.5 12.4 0 8 0z" fill="#e3262f"/><circle cx="8" cy="8" r="3" fill="#0f1115"/></svg>
    </div>
    <div class="name">RASTREANDO<small>GPS</small></div>
  </div>
  <div class="hdir">
    <span class="demo" id="live">ENTRAR</span>
    <button class="tema" id="btnTema" aria-label="Alternar modo escuro e claro">
      <svg class="lua" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sol" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="tema" id="btnSair" aria-label="Sair">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</header>

<main id="main">
  <div id="map"></div>

  <button class="follow" id="follow" aria-pressed="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2" fill="currentColor"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    <span id="followTxt">Seguir</span>
  </button>

  <div class="vazio" id="vazio">Nenhum veículo selecionado<small>Abra a aba Veículos para escolher.</small></div>

  <section class="sheet" id="sheet">
    <div class="dragzone" id="dragzone">
      <div class="handlewrap"><span class="handle"></span></div>
      <div class="row">
        <div>
          <div class="vname" id="vName"></div>
          <div class="plate" id="vPlate"></div>
        </div>
        <span class="status" id="vStatus"></span>
      </div>
    </div>
    <div class="banner" id="banner">Veículo bloqueado</div>
    <div class="grid">
      <div class="stat"><span>Velocidade</span><b id="sSpeed"></b></div>
      <div class="stat"><span>Ignição</span><b id="sIgn"></b></div>
      <div class="stat"><span>Bateria</span><b id="sBat"></b></div>
    </div>
    <div class="addr"><strong id="vAddr"></strong><span id="vAgo"></span></div>
    <div class="actions">
      <button class="btn btn-red" id="btnBlock">Bloquear</button>
      <button class="btn btn-out" id="btnUnblock">Desbloquear</button>
      <button class="btn btn-out" id="btnShare" aria-label="Compartilhar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
      </button>
    </div>
    <div class="actions dois">
      <button class="btn btn-out" id="btnNav">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l18-8-8 18-2-8z"/></svg>
        Navegar
      </button>
      <button class="btn btn-out" id="btnRua">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2.5"/><path d="M12 8v6M8 11h8M9 21l3-7 3 7"/></svg>
        Ver a rua
      </button>
    </div>
  </section>

  <section class="vview" id="vview">
    <div class="vtop">
      <div class="vtitle">
        <h2>Veículos</h2>
        <button class="linkbtn" id="vAll">Selecionar todos</button>
      </div>
      <div class="vcount" id="vCount"></div>
      <input class="search" id="vSearch" type="search" placeholder="Buscar veículo ou placa" autocomplete="off">
    </div>
    <div class="vlist" id="vList"></div>
  </section>
</main>

<nav>
  <button class="on" data-tab="Mapa"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Mapa</button>
  <button data-tab="Veículos"><svg viewBox="0 0 24 24"><path d="M4 16v-4l2-5h12l2 5v4"/><path d="M4 12h16"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/></svg>Veículos</button>
  <button data-tab="Histórico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Histórico</button>
  <button data-tab="Cercas"><svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7l8-4z"/></svg>Cercas</button>
  <button data-tab="Alertas"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1112 0v5l2 2H4l2-2z"/><path d="M10 21h4"/></svg>Alertas</button>
</nav>

<!-- Confirmar comando -->
<div class="modal" id="mCmd">
  <div class="box2">
    <h3 id="cmdTitle"></h3>
    <p id="cmdText"></p>
    <div class="warn" id="cmdWarn"></div>
    <div class="actions2">
      <button class="btn btn-out" data-close>Cancelar</button>
      <button class="btn btn-red" id="cmdOk">Confirmar</button>
    </div>
  </div>
</div>

<!-- Compartilhar -->
<div class="modal" id="mShare">
  <div class="box2">
    <h3>Compartilhar localização</h3>
    <p>Quem receber o link vê só a posição deste veículo, sem acesso à sua conta.</p>
    <div class="opts" id="shareOpts">
      <button class="opt sel" data-h="1">1 hora</button>
      <button class="opt" data-h="24">24 horas</button>
      <button class="opt" data-h="168">7 dias</button>
    </div>
    <div class="link" id="shareLink"></div>
    <div class="actions2">
      <button class="btn btn-out" data-close>Fechar</button>
      <button class="btn btn-red" id="shareCopy">Copiar link</button>
    </div>
  </div>
</div>

<div class="login show" id="login">
  <form class="lbox" id="lform">
    <div class="lbrand">
      <img src="logo.jpeg" alt="" onerror="this.style.display='none'">
      <b>RASTREANDO GPS</b>
      <span>Entre com seu e-mail e senha</span>
    </div>
    <input type="email" id="lEmail" placeholder="E-mail" autocomplete="username" required>
    <input type="password" id="lSenha" placeholder="Senha" autocomplete="current-password" required>
    <div class="lerr" id="lErr"></div>
    <button class="btn btn-red" id="lBtn" type="submit">Entrar</button>
  </form>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ===== CONFIGURAÇÃO ===== */
const API = 'https://api.rastreandogpsbr.com.br';
const INTERVALO = 5000; // consulta ao servidor a cada 5 s (não gera tráfego no chip do aparelho)

let auth = null;            // cabeçalho de autorização (token ou senha)
let veiculos = [];
let selId = null, seguir = false, cmdAndamento = false, acaoCmd = null;
let recolhido = false, arrastando = false, buscando = false, primeiraCarga = true, assinaturaLista = '';

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet = k => { try{return localStorage.getItem(k)}catch(e){return null} };
const lsSet = (k,v) => { try{localStorage.setItem(k,v)}catch(e){} };
const lsDel = k => { try{localStorage.removeItem(k)}catch(e){} };
const ssGet = k => { try{return sessionStorage.getItem(k)}catch(e){return null} };
const ssSet = (k,v) => { try{sessionStorage.setItem(k,v)}catch(e){} };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const ativo = () => veiculos.find(v=>v.id===selId && v.visivel && v.pos) || null;
const visiveis = () => veiculos.filter(v=>v.visivel);
const comPos = () => veiculos.filter(v=>v.visivel && v.pos);

/* ===== MAPA ===== */
const map = L.map('map',{zoomControl:false,attributionControl:false}).setView([-22.787,-43.307],15);
L.control.attribution({position:'topleft',prefix:false}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19,attribution:'© OpenStreetMap'
}).addTo(map);

const carSvg = '<svg viewBox="0 0 44 44" width="44" height="44"><circle cx="22" cy="22" r="18" fill="rgba(56,225,230,.14)" stroke="#38e1e6" stroke-width="1.5"/><path d="M22 8 L31 32 L22 27 L13 32 Z" fill="#e3262f" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';

function criarMarcador(v){
  v.marker = L.marker(v.pos,{icon:L.divIcon({
    className:'',iconSize:[44,44],iconAnchor:[22,22],
    html:'<div class="car">'+carSvg+'</div><div class="carlabel">'+esc(v.nome)+'</div>'
  })});
  v.marker.on('click',()=>{ selId = v.id; recolhido = false; atualizar(); });
  if(v.visivel) v.marker.addTo(map);
}

/* ===== SEGUIR VEÍCULO ===== */
function setSeguir(on){
  seguir = on;
  $('follow').classList.toggle('active',on);
  $('follow').setAttribute('aria-pressed',on?'true':'false');
  $('followTxt').textContent = on ? 'Seguindo' : 'Seguir';
  if(on) map.dragging.disable(); else map.dragging.enable();
}
$('follow').onclick = ()=>{
  if(!seguir && !ativo()){ toast('Nenhum veículo selecionado'); return }
  setSeguir(!seguir);
};
function cobertura(){
  const s = $('sheet');
  if(s.style.display==='none') return 0;
  const m = $('main').getBoundingClientRect(), r = s.getBoundingClientRect();
  return Math.max(0, m.bottom - r.top);
}
function centralizar(pos){
  const z = map.getZoom(), c = cobertura();
  const p = map.project(L.latLng(pos),z).add([0,c/2]);
  const cur = map.project(map.getCenter(),z);
  if(Math.abs(cur.x-p.x)>0.5 || Math.abs(cur.y-p.y)>0.5){
    map.setView(map.unproject(p,z),z,{animate:false});
  }
}
function ajustarTodos(vs){
  if(!vs.length) return;
  const c = cobertura();
  map.fitBounds(L.latLngBounds(vs.map(v=>v.pos)),{
    paddingTopLeft:[40,70],paddingBottomRight:[40,c+30],maxZoom:17,animate:false
  });
}

/* ===== UTILITÁRIOS ===== */
let tt;
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function tempo(ms){
  const s=Math.max(0,Math.round(ms/1000));
  if(s<60)return 'há '+s+' s';
  const m=Math.round(s/60); if(m<60)return 'há '+m+' min';
  const h=Math.round(m/60); if(h<48)return 'há '+h+' h';
  return 'há '+Math.round(h/24)+' dias';
}
function status(v){
  if(!v.pos) return ['Sem posição','st-off'];
  if(v.bloq) return ['Bloqueado','st-block'];
  if(!v.online) return ['Sem conexão','st-off'];
  if(v.ign===false) return ['Desligado','st-off'];
  if(v.vel>2) return ['Em movimento','st-move'];
  return ['Parado','st-stop'];
}
function indicador(texto,ok){
  const e=$('live'); e.textContent=texto; e.classList.toggle('ok',!!ok);
}

/* ===== COMUNICAÇÃO COM O SERVIDOR ===== */
async function api(caminho,opcoes){
  const o = opcoes||{};
  const h = Object.assign({Authorization:auth,Accept:'application/json'},o.headers||{});
  const r = await fetch(API+caminho,{method:o.method||'GET',headers:h,body:o.body,credentials:'omit'});
  if(r.status===401){ const e=new Error('401'); e.sessao=true; throw e }
  return r;
}

async function buscar(){
  const [rd,rp] = await Promise.all([api('/api/devices'),api('/api/positions')]);
  if(!rd.ok||!rp.ok) throw new Error('Servidor respondeu erro '+(rd.ok?rp.status:rd.status));
  mesclar(await rd.json(), await rp.json());
}

function mesclar(ds,ps){
  const pm = {}; ps.forEach(p=>pm[p.deviceId]=p);
  const ids = new Set(ds.map(d=>d.id));
  veiculos.filter(v=>!ids.has(v.id)).forEach(v=>{ if(v.marker&&map.hasLayer(v.marker)) map.removeLayer(v.marker) });
  veiculos = veiculos.filter(v=>ids.has(v.id));
  ds.forEach(d=>{
    let v = veiculos.find(x=>x.id===d.id);
    if(!v){
      v = {id:d.id,visivel:true,marker:null,pos:null,de:null,para:null,t0:0,rumo:0,vel:0,
           ign:null,bat:null,bloq:false,online:false,fix:null,addr:null,posId:null,result:null,placa:'',nome:''};
      veiculos.push(v);
    }
    v.nome = d.name || ('Aparelho '+d.id);
    v.placa = (d.attributes&&d.attributes.placa) || d.model || '';
    v.online = d.status==='online';
    const p = pm[d.id];
    if(p){
      const a = p.attributes||{};
      v.vel = Math.round((p.speed||0)*1.852);
      v.ign = typeof a.ignition==='boolean' ? a.ignition : null;
      v.bat = a.batteryLevel!=null && !isNaN(a.batteryLevel) ? Math.round(a.batteryLevel) : null;
      v.fix = new Date(p.fixTime).getTime();
      v.addr = p.address || null;
      v.rumo = p.course||0;
      v.posId = p.id;
      v.result = a.result || null;
      v.bloq = typeof a.blocked==='boolean' ? a.blocked : lsGet('rg_bloq_'+v.id)==='1';
      const nova = [p.latitude,p.longitude];
      if(!v.pos){ v.pos = nova.slice(); criarMarcador(v) }
      else {
        const alvo = v.para || v.pos;
        if(Math.abs(alvo[0]-nova[0])>1e-6 || Math.abs(alvo[1]-nova[1])>1e-6){
          if(Math.abs(v.pos[0]-nova[0])<0.01 && Math.abs(v.pos[1]-nova[1])<0.01){
            v.de = v.pos.slice(); v.para = nova; v.t0 = performance.now();
          } else { v.pos = nova.slice(); v.de = null; v.para = null; v.marker.setLatLng(v.pos) }
        }
      }
    } else {
      v.bloq = lsGet('rg_bloq_'+v.id)==='1';
    }
  });
  if(!selId || !veiculos.find(v=>v.id===selId)) selId = veiculos.length ? veiculos[0].id : null;
  const sig = veiculos.map(v=>v.id+':'+v.nome+':'+v.placa).join('|');
  if(sig!==assinaturaLista){ assinaturaLista=sig; desenharLista() }
  if(primeiraCarga){ primeiraCarga=false; mudouSelecao() }
  atualizarContagem(); atualizar();
}

async function buscarSeguro(){
  if(buscando || !auth) return;
  buscando = true;
  try{
    await buscar();
    indicador('TEMPO REAL',true);
  }catch(e){
    if(e.sessao){ sair('Sessão expirada. Entre novamente.') }
    else indicador('SEM CONEXÃO',false);
  }
  buscando = false;
}
setInterval(()=>{ if(document.visibilityState==='visible') buscarSeguro() },INTERVALO);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') buscarSeguro() });

/* ===== ANIMAÇÃO SUAVE (feita no app) ===== */
function animar(now){
  veiculos.forEach(v=>{
    if(!v.marker) return;
    if(v.de && v.para){
      const f=Math.min(1,(now-v.t0)/INTERVALO);
      v.pos=[v.de[0]+(v.para[0]-v.de[0])*f, v.de[1]+(v.para[1]-v.de[1])*f];
      v.marker.setLatLng(v.pos);
      if(f>=1){ v.de=null; v.para=null }
    }
    const el=v.marker.getElement();
    if(el){const c=el.querySelector('.car');if(c){c.style.transform='rotate('+v.rumo+'deg)';c.classList.toggle('off',!v.online||v.ign===false)}}
  });
  const a=ativo();
  if(seguir && a) centralizar(a.pos);
  requestAnimationFrame(animar);
}
requestAnimationFrame(animar);

/* ===== CARTÃO ARRASTÁVEL ===== */
const sheet = $('sheet'), zone = $('dragzone');
let y0=0, off0=0, moveu=false, naAlca=false;
function maxOff(){
  const peek = zone.getBoundingClientRect().bottom - sheet.getBoundingClientRect().top + 12;
  return Math.max(0, sheet.offsetHeight - peek);
}
function offAtual(){ return recolhido ? maxOff() : 0 }
function aplicarSheet(){
  if(arrastando) return;
  sheet.style.transform = 'translateY('+offAtual()+'px)';
}
zone.addEventListener('pointerdown',e=>{
  arrastando=true; moveu=false; y0=e.clientY; off0=offAtual();
  naAlca = !!e.target.closest('.handlewrap');
  sheet.classList.add('drag');
  try{zone.setPointerCapture(e.pointerId)}catch(_){}
});
zone.addEventListener('pointermove',e=>{
  if(!arrastando) return;
  const dy=e.clientY-y0;
  if(Math.abs(dy)>4) moveu=true;
  const o=Math.max(0,Math.min(maxOff(),off0+dy));
  sheet.style.transform='translateY('+o+'px)';
});
function soltar(e){
  if(!arrastando) return;
  const dy=e.clientY-y0;
  arrastando=false; sheet.classList.remove('drag');
  if(!moveu){ if(naAlca) recolhido=!recolhido }
  else if(dy>40) recolhido=true;
  else if(dy<-40) recolhido=false;
  aplicarSheet();
}
zone.addEventListener('pointerup',soltar);
zone.addEventListener('pointercancel',soltar);

/* ===== TELA ===== */
function atualizar(){
  const v=ativo();
  sheet.style.display = v ? 'block' : 'none';
  $('vazio').style.display = (v || !veiculos.length) ? 'none' : 'block';
  if(v){
    const [txt,cls]=status(v);
    $('vName').textContent=v.nome;
    $('vPlate').textContent=v.placa;
    $('vStatus').textContent=txt; $('vStatus').className='status '+cls;
    $('sSpeed').textContent=v.vel+' km/h';
    $('sIgn').textContent=v.ign===null?'—':(v.ign?'Ligada':'Desligada');
    $('sBat').textContent=v.bat===null?'—':v.bat+'%';
    $('vAddr').textContent = v.addr || (v.pos[0].toFixed(5)+', '+v.pos[1].toFixed(5));
    $('vAgo').textContent = v.fix ? 'GPS '+tempo(Date.now()-v.fix) : '';
    $('banner').classList.toggle('show',v.bloq);
    $('btnBlock').disabled=cmdAndamento;
    $('btnUnblock').disabled=cmdAndamento;
    aplicarSheet();
  }
  document.querySelectorAll('.vrow').forEach(r=>{
    const x=veiculos.find(q=>q.id===+r.dataset.id); if(!x) return;
    const [t,c]=status(x), s=r.querySelector('.status');
    if(s.textContent!==t){s.textContent=t;s.className='status sm '+c}
  });
}
setInterval(atualizar,1000);

/* ===== ABA VEÍCULOS ===== */
function desenharLista(){
  const q=$('vSearch').value.trim().toLowerCase();
  const lista=veiculos.filter(v=>!q||v.nome.toLowerCase().includes(q)||v.placa.toLowerCase().includes(q));
  $('vList').innerHTML = lista.map(v=>{
    const [t,c]=status(v);
    return '<div class="vrow" data-id="'+v.id+'">'+
      '<label class="chk"><input type="checkbox"'+(v.visivel?' checked':'')+' aria-label="Mostrar '+esc(v.nome)+' no mapa"><span class="box"></span></label>'+
      '<button class="vinfo"><div class="vn">'+esc(v.nome)+'</div><div class="vp">'+esc(v.placa)+'</div></button>'+
      '<span class="status sm '+c+'">'+t+'</span></div>';
  }).join('') || '<div class="vempty">Nenhum veículo encontrado.</div>';
}
function atualizarContagem(){
  const n=visiveis().length;
  $('vCount').textContent=n+' de '+veiculos.length+' no mapa';
  $('vAll').textContent = (n===veiculos.length && n>0) ? 'Desmarcar todos' : 'Selecionar todos';
}
function sincronizarChecks(){
  document.querySelectorAll('#vList .vrow').forEach(r=>{
    const v=veiculos.find(x=>x.id===+r.dataset.id);
    if(v) r.querySelector('input').checked=v.visivel;
  });
}
function aplicarVisibilidade(){
  veiculos.forEach(v=>{
    if(!v.marker) return;
    if(v.visivel){ if(!map.hasLayer(v.marker)) v.marker.addTo(map) }
    else if(map.hasLayer(v.marker)) map.removeLayer(v.marker);
  });
  const vs=comPos();
  if(vs.length && !ativo()) selId=vs[0].id;
}
function mudouSelecao(){
  aplicarVisibilidade();
  const vs=comPos();
  if(vs.length===1){ selId=vs[0].id; setSeguir(true) }
  else if(vs.length>1){ setSeguir(false); atualizar(); ajustarTodos(vs) }
  else setSeguir(false);
  atualizarContagem(); atualizar();
}
$('vList').addEventListener('change',e=>{
  const r=e.target.closest('.vrow'); if(!r) return;
  veiculos.find(x=>x.id===+r.dataset.id).visivel=e.target.checked;
  mudouSelecao();
});
$('vList').addEventListener('click',e=>{
  const b=e.target.closest('.vinfo'); if(!b) return;
  const v=veiculos.find(x=>x.id===+b.parentNode.dataset.id);
  if(!v.pos){ toast('Este aparelho ainda não enviou posição'); return }
  v.visivel=true; aplicarVisibilidade(); selId=v.id; recolhido=false;
  sincronizarChecks(); atualizarContagem();
  irPara('Mapa'); setSeguir(true); atualizar();
});
$('vAll').onclick=()=>{
  const todos = visiveis().length===veiculos.length;
  veiculos.forEach(v=>v.visivel=!todos);
  sincronizarChecks(); mudouSelecao();
};
$('vSearch').addEventListener('input',desenharLista);

/* ===== BLOQUEIO / DESBLOQUEIO (comando real) ===== */
function abrir(id){$(id).classList.add('show')}
function fechar(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('show'))}
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=fechar);
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)fechar()}));

function abrirConfirmacao(acao){
  const v=ativo(); if(!v) return;
  if(!v.online){
    toast('Aparelho sem conexão com o servidor. Por segurança, o comando não foi enviado.');
    return;
  }
  acaoCmd=acao;
  const bloquear = acao==='bloquear';
  $('cmdTitle').textContent=(bloquear?'Bloquear ':'Desbloquear ')+v.nome+'?';
  $('cmdText').textContent = bloquear
    ? 'O motor será cortado. O veículo só volta a funcionar depois do desbloqueio.'
    : 'O veículo poderá ser ligado normalmente.';
  const w=$('cmdWarn'), avisos=[];
  if(bloquear){
    if(v.vel>2) avisos.push('Atenção: o veículo está em movimento ('+v.vel+' km/h). Bloquear com o veículo andando pode causar acidente.');
    else if(v.fix && Date.now()-v.fix>600000) avisos.push('A última posição do GPS é '+tempo(Date.now()-v.fix)+'. Não dá para garantir que o veículo está parado.');
  }
  if(avisos.length){ w.textContent=avisos.join(' '); w.classList.add('show') } else w.classList.remove('show');
  $('cmdOk').textContent=bloquear?'Bloquear':'Desbloquear';
  abrir('mCmd');
}
$('btnBlock').onclick=()=>abrirConfirmacao('bloquear');
$('btnUnblock').onclick=()=>abrirConfirmacao('desbloquear');

$('cmdOk').onclick=async ()=>{
  const v=ativo(); if(!v) return;
  const acao=acaoCmd, bloquear=acao==='bloquear', btn=bloquear?$('btnBlock'):$('btnUnblock');
  const rotulo=bloquear?'Bloquear':'Desbloquear';
  fechar(); cmdAndamento=true;
  btn.innerHTML='<span class="spin"></span>Enviando...';
  const posAntes=v.posId;
  try{
    const r=await api('/api/commands/send',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({deviceId:v.id,type:'custom',attributes:{data:bloquear?'RELAY,1#':'RELAY,0#'}})
    });
    if(!r.ok) throw new Error('O servidor recusou o comando (erro '+r.status+')');
    toast('Comando enviado. Aguardando o aparelho...');
    let respondeu=false;
    for(let i=0;i<20 && !respondeu;i++){
      await sleep(2000);
      buscando=false; await buscarSeguro();
      if(v.posId!==posAntes && v.result){
        respondeu=true;
        if(/success/i.test(v.result)){
          v.bloq=bloquear; lsSet('rg_bloq_'+v.id,bloquear?'1':'0');
          toast(bloquear?'Bloqueio confirmado pelo aparelho':'Desbloqueio confirmado pelo aparelho');
        } else toast('O aparelho respondeu: '+v.result);
      }
    }
    if(!respondeu) toast('O aparelho não respondeu em 40 segundos. Confira antes de repetir.');
  }catch(e){
    if(e.sessao) sair('Sessão expirada. Entre novamente.');
    else toast(e.message && e.message!=='Failed to fetch' ? e.message : 'Não consegui falar com o servidor.');
  }
  cmdAndamento=false;
  $('btnBlock').textContent='Bloquear'; $('btnUnblock').textContent='Desbloquear';
  atualizar();
};

/* ===== NAVEGAR / VER A RUA / COMPARTILHAR ===== */
$('btnNav').onclick=()=>{
  const v=ativo(); if(!v) return;
  window.open('https://www.google.com/maps/dir/?api=1&destination='+v.pos[0].toFixed(6)+','+v.pos[1].toFixed(6)+'&travelmode=driving','_blank','noopener');
};
$('btnRua').onclick=()=>{
  const v=ativo(); if(!v) return;
  window.open('https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+v.pos[0].toFixed(6)+','+v.pos[1].toFixed(6),'_blank','noopener');
};
$('btnShare').onclick=()=>toast('Compartilhar: em construção');

/* ===== ABAS ===== */
function irPara(tab){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  $('vview').classList.toggle('show',tab==='Veículos');
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{
  const t=b.dataset.tab;
  if(t==='Mapa'||t==='Veículos') irPara(t);
  else toast(t+': em construção');
});

/* ===== ENTRAR / SAIR ===== */
function mostrarLogin(msg){
  $('login').classList.add('show');
  $('lErr').textContent = msg||'';
}
function sair(msg){
  lsDel('rg_token'); try{sessionStorage.removeItem('rg_basic')}catch(e){}
  auth=null;
  veiculos.forEach(v=>{ if(v.marker&&map.hasLayer(v.marker)) map.removeLayer(v.marker) });
  veiculos=[]; selId=null; primeiraCarga=true; assinaturaLista='';
  desenharLista(); atualizarContagem(); atualizar();
  indicador('SAIU',false);
  mostrarLogin(msg);
}
async function entrar(email,senha){
  const basic='Basic '+btoa(unescape(encodeURIComponent(email+':'+senha)));
  const r=await fetch(API+'/api/devices',{headers:{Authorization:basic,Accept:'application/json'},credentials:'omit'});
  if(r.status===401||r.status===403) throw new Error('E-mail ou senha incorretos.');
  if(!r.ok) throw new Error('O servidor respondeu com erro '+r.status+'.');
  // tenta trocar a senha por um token de 30 dias, para não guardar a senha no aparelho
  let token=null;
  try{
    const exp=new Date(Date.now()+30*86400000).toISOString();
    const t=await fetch(API+'/api/session/token',{method:'POST',credentials:'omit',
      headers:{Authorization:basic,'Content-Type':'application/x-www-form-urlencoded'},
      body:'expiration='+encodeURIComponent(exp)});
    if(t.ok){
      const txt=(await t.text()).trim().replace(/^"|"$/g,'');
      const teste=await fetch(API+'/api/devices',{headers:{Authorization:'Bearer '+txt,Accept:'application/json'},credentials:'omit'});
      if(txt && teste.ok) token=txt;
    }
  }catch(_){}
  if(token){ auth='Bearer '+token; lsSet('rg_token',token) }
  else { auth=basic; ssSet('rg_basic',basic) }
}
$('lform').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('lBtn'); btn.disabled=true; btn.textContent='Entrando...'; $('lErr').textContent='';
  try{
    await entrar($('lEmail').value.trim(),$('lSenha').value);
    $('lSenha').value='';
    $('login').classList.remove('show');
    indicador('CONECTANDO...',false);
    await buscarSeguro();
  }catch(err){
    $('lErr').textContent = (err instanceof TypeError)
      ? 'Não consegui falar com o servidor. Confira a internet e tente de novo.'
      : err.message;
  }
  btn.disabled=false; btn.textContent='Entrar';
});
$('btnSair').onclick=()=>sair('');

(async function iniciar(){
  setSeguir(false);
  const tok=lsGet('rg_token'), basic=ssGet('rg_basic');
  if(tok) auth='Bearer '+tok; else if(basic) auth=basic;
  if(auth){
    $('login').classList.remove('show');
    await buscarSeguro();
  } else mostrarLogin('');
})();

</script>
<script>
(function(){
  var raiz=document.documentElement, meta=document.querySelector('meta[name="theme-color"]');
  function ajusta(){
    var claro=raiz.getAttribute('data-tema')==='claro';
    if(meta)meta.setAttribute('content',claro?'#f4f6f9':'#0f1115');
  }
  ajusta();
  document.getElementById('btnTema').addEventListener('click',function(){
    var novo=raiz.getAttribute('data-tema')==='claro'?'escuro':'claro';
    raiz.setAttribute('data-tema',novo);
    try{localStorage.setItem('tema',novo)}catch(e){}
    ajusta();
  });
})();
</script>
