<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f1216">
<title>Planos anuais · Rastreando GPS</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- 10/11/2026 (Publicação 146, pedido do dono): página dos PLANOS ANUAIS do cliente (ex.: Frente Localizações / Sérgio Alipio).
     Abre pelo link com código (?c=...), sem login. Só mostra os aparelhos daquele cliente e os dias restantes de cada um.
     O cliente marca aparelhos: vê o valor da renovação (R$ 320 rastreador, R$ 118 TAG; renovar só para quem vence em até 90 dias)
     e pode PEDIR cancelamento (o dono recebe no Telegram, fixado; nada é cancelado sozinho).
     Etapa 2 (depois): botão Pagar com PIX, que renova sozinho. Os dados vêm do servidor (rastreamentoDesbloqueio: anuaisVer / anuaisCancelar). -->
<style>
:root{--bg:#0f1216;--card:#171b21;--card2:#1e232b;--line:#2a3039;--txt:#f2f4f7;--mut:#9aa3b2;--red:#e3262f;--red2:#ff5a61;--ok:#22c55e;--amb:#f5b83d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding:0 0 calc(150px + env(safe-area-inset-bottom))}
.wrap{max-width:640px;margin:0 auto;padding:0 12px}
header{padding:18px 4px 10px;display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:none}
header h1{font-size:19px;line-height:1.2}
header p{font-size:12.5px;color:var(--mut);margin-top:2px}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.rs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center}
.rs b{display:block;font-size:20px}
.rs small{font-size:11px;color:var(--mut);line-height:1.25;display:block;margin-top:2px}
.rs.alerta{border-color:rgba(227,38,47,.55);background:linear-gradient(180deg,rgba(227,38,47,.14),var(--card))}
.rs.alerta b{color:var(--red2)}
.barra{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.barra input{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:10px 12px;font-size:15px}
.chip{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:999px;padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.chip:active{transform:scale(.97)}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:16px 4px 6px;font-weight:700}
.lista{display:flex;flex-direction:column;gap:6px}
.it{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.it.sel{outline:2px solid #3b82f6;outline-offset:-1px}
.it input{width:22px;height:22px;accent-color:#3b82f6}
.nm{font-weight:700;font-size:15px;line-height:1.2;word-break:break-word}
.nm .tp{font-size:10.5px;font-weight:700;color:var(--mut);border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px}
.sub{font-size:12px;color:var(--mut);margin-top:3px;line-height:1.35;word-break:break-all}
.dd{text-align:right;min-width:76px}
.dd b{display:block;font-size:22px;line-height:1}
.dd small{display:block;font-size:11px;color:var(--mut);margin-top:3px}
.it.perto{border-color:rgba(227,38,47,.65);background:linear-gradient(90deg,rgba(227,38,47,.16),var(--card) 70%)}
.it.perto .dd b{color:var(--red2)}
.it.venc .dd b{color:var(--red2)}
.renova{display:block;font-size:11.5px;color:var(--red2);font-weight:700;margin-top:3px}
.ped{display:inline-block;font-size:11px;color:var(--amb);font-weight:700;margin-top:4px}
.vazio,.erro{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--mut);margin-top:20px;line-height:1.5}
.erro{color:var(--red2)}
.rodape{position:fixed;left:0;right:0;bottom:0;background:rgba(15,18,22,.97);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
.rodape .wrap{padding:0}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px;font-size:13.5px;color:var(--mut)}
.tot b{color:var(--txt);font-size:18px}
.tot .nota{font-size:11.5px;color:var(--amb)}
.bts{display:flex;gap:8px}
.bt{flex:1;border:0;border-radius:12px;padding:13px 10px;font-size:15px;font-weight:700;color:#fff;background:#3b82f6}
.bt.sec2{background:var(--card2);border:1px solid var(--line);color:var(--txt)}
.bt.can{background:transparent;border:1px solid rgba(227,38,47,.6);color:var(--red2)}
.bt:disabled{opacity:.45}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:640px;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.mbox h2{font-size:18px;margin-bottom:8px}
.mbox p{font-size:14px;color:var(--mut);line-height:1.45;margin-bottom:10px}
.mbox ul{list-style:none;margin:8px 0 14px;font-size:13.5px;line-height:1.6}
.mbox li{border-bottom:1px solid var(--line);padding:4px 0}
.carreg{text-align:center;color:var(--mut);padding:40px 0}
.atual{font-size:11.5px;color:var(--mut);text-align:center;margin:14px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.jpeg" alt="" onerror="this.style.display='none'">
    <div><h1 id="empresa">Planos anuais</h1><p id="sub">Rastreando GPS</p></div>
  </header>
  <div id="conteudo"><div class="carreg">Carregando…</div></div>
  <p class="atual" id="atual"></p>
</div>

<div class="rodape" id="rodape" hidden>
  <div class="wrap">
    <div class="tot"><span><span id="nSel">0</span> marcado(s)</span><span>Renovação: <b id="vSel">R$ 0</b></span></div>
    <div class="tot" id="notaRow" hidden><span class="nota" id="nota"></span></div>
    <div class="bts">
      <button class="bt sec2" id="btLimpar" type="button">Limpar</button>
      <button class="bt can" id="btCancelar" type="button" disabled>Pedir cancelamento</button>
    </div>
  </div>
</div>

<div class="modal" id="mCanc">
  <div class="mbox">
    <h2>Pedir cancelamento?</h2>
    <p>Estes aparelhos vão para a Rastreando GPS como pedido de cancelamento. <b>Nada é cancelado na hora</b>: a gente confere e te responde.</p>
    <ul id="mLista"></ul>
    <p id="mDias"></p>
    <div class="bts"><button class="bt sec2" id="mVoltar" type="button">Voltar</button><button class="bt can" id="mOk" type="button">Enviar pedido</button></div>
  </div>
</div>

<script>
const DESB_URL='https://southamerica-east1-rastreando-assinaturas.cloudfunctions.net/rastreamentoDesbloqueio';
const WPP='5521980886087'; /* WhatsApp de atendimento da Rastreando GPS */
const COD=(new URLSearchParams(location.search).get('c')||'').replace(/[^A-Za-z0-9]/g,'');
const $=id=>document.getElementById(id);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:0,maximumFractionDigits:2});
const TIPO={portatil:'Rastreador',instalado:'Rastreador',tag:'TAG'};
let dados=null, sel=new Set(), filtro='';

async function api(acao,extra){
  const r=await fetch(DESB_URL,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'omit',body:JSON.stringify(Object.assign({acao,codigo:COD},extra||{}))});
  let j={}; try{ j=await r.json() }catch(e){}
  if(!r.ok) throw new Error(j.erro||('Erro '+r.status));
  return j;
}
function diasTxt(d){ return d<0?{n:Math.abs(d),t:'vencido há'}:d===0?{n:'HOJE',t:'vence'}:{n:d,t:d===1?'dia':'dias'} }
function linha(x){
  const perto=x.dias<=30, dt=diasTxt(x.dias), on=sel.has(x.id);
  const sub=[x.chip?'Linha '+esc(x.chip):'', x.imei?(x.tipo==='tag'?'Nº ':'IMEI ')+esc(x.imei):''].filter(Boolean).join('<br>');
  return '<label class="it'+(perto?' perto':'')+(x.dias<0?' venc':'')+(on?' sel':'')+'" data-id="'+esc(x.id)+'">'+
    '<input type="checkbox"'+(on?' checked':'')+'>'+
    '<div><div class="nm">'+esc(x.nome)+'<span class="tp">'+TIPO[x.tipo]+'</span></div>'+
      '<div class="sub">'+sub+'</div>'+
      (perto?'<span class="renova">Renovação '+brl(x.valor)+' · vence '+esc(x.vence)+'</span>':'<div class="sub">Vence '+esc(x.vence)+'</div>')+
      (x.cancelamento?'<span class="ped">⏳ Cancelamento pedido</span>':'')+
    '</div>'+
    '<div class="dd">'+(x.dias<0?'<small>'+dt.t+'</small><b>'+dt.n+'</b><small>dias</small>':'<b>'+dt.n+'</b><small>'+dt.t+'</small>')+'</div></label>';
}
function desenhar(){
  const it=dados.itens||[], f=filtro.trim().toLowerCase();
  const vis=f?it.filter(x=>(x.nome+' '+x.chip+' '+x.imei).toLowerCase().includes(f)):it;
  const perto=it.filter(x=>x.dias<=30), vPerto=perto.reduce((t,x)=>t+x.valor,0);
  let h='<div class="resumo">'+
    '<div class="rs"><b>'+it.length+'</b><small>aparelhos no plano anual</small></div>'+
    '<div class="rs'+(perto.length?' alerta':'')+'"><b>'+perto.length+'</b><small>vencem em até 30 dias</small></div>'+
    '<div class="rs'+(perto.length?' alerta':'')+'"><b>'+brl(vPerto)+'</b><small>renovação dos próximos 30 dias</small></div></div>';
  h+='<div class="barra"><input id="busca" type="search" placeholder="Procurar nome, linha ou IMEI" value="'+esc(filtro)+'">'+
     (perto.length?'<button class="chip" id="mk30" type="button">Marcar os de 30 dias</button>':'')+'</div>';
  if(!it.length) h+='<div class="vazio">Nenhum aparelho no plano anual.</div>';
  else if(!vis.length) h+='<div class="vazio">Nada encontrado.</div>';
  else{
    const g=[['Vencem em até 30 dias',x=>x.dias<=30],['De 31 a 90 dias',x=>x.dias>30&&x.dias<=90],['Mais de 90 dias',x=>x.dias>90]];
    for(const [t,fn] of g){ const l=vis.filter(fn); if(!l.length) continue; h+='<div class="sec">'+t+' ('+l.length+')</div><div class="lista">'+l.map(linha).join('')+'</div>'; }
  }
  $('conteudo').innerHTML=h;
  const b=$('busca'); b.oninput=()=>{ filtro=b.value; const p=b.selectionStart; desenhar(); const nb=$('busca'); nb.focus(); try{ nb.setSelectionRange(p,p) }catch(e){} };
  const m=$('mk30'); if(m) m.onclick=()=>{ it.filter(x=>x.dias<=30).forEach(x=>sel.add(x.id)); desenhar(); };
  rodape();
}
function rodape(){
  const it=(dados&&dados.itens)||[], s=it.filter(x=>sel.has(x.id));
  $('rodape').hidden=!it.length;
  const pagaveis=s.filter(x=>x.podePagar), fora=s.length-pagaveis.length;
  $('nSel').textContent=s.length;
  $('vSel').textContent=brl(pagaveis.reduce((t,x)=>t+x.valor,0));
  const nota=fora?fora+' marcado(s) vence(m) em mais de '+(dados.pagarAte||90)+' dias: ainda não entra(m) na renovação.':(pagaveis.length?'Pagamento por PIX direto por aqui: em breve.':'');
  $('notaRow').hidden=!nota; $('nota').textContent=nota;
  $('btCancelar').disabled=!s.length||s.every(x=>x.cancelamento);
}
document.addEventListener('change',e=>{
  const l=e.target.closest&&e.target.closest('.it'); if(!l) return;
  const id=l.dataset.id; if(e.target.checked) sel.add(id); else sel.delete(id);
  l.classList.toggle('sel',e.target.checked); rodape();
});
$('btLimpar').onclick=()=>{ sel.clear(); desenhar(); };
$('btCancelar').onclick=()=>{
  const s=dados.itens.filter(x=>sel.has(x.id)&&!x.cancelamento);
  $('mLista').innerHTML=s.map(x=>'<li><b>'+esc(x.nome)+'</b> · '+esc(x.chip||x.imei)+' · '+(x.dias<0?'vencido':x.dias+' dias')+'</li>').join('');
  const sobra=s.filter(x=>x.tipo!=='instalado').reduce((t,x)=>t+Math.max(0,x.dias),0);
  $('mDias').textContent=sobra?'Os dias que ainda restam nesses aparelhos podem ser repassados para os outros do mesmo tipo (rastreador portátil para portátil, TAG para TAG).':'';
  $('mCanc').classList.add('show');
};
$('mVoltar').onclick=()=>$('mCanc').classList.remove('show');
$('mOk').onclick=async()=>{
  const s=dados.itens.filter(x=>sel.has(x.id)&&!x.cancelamento), b=$('mOk');
  b.disabled=true; b.textContent='Enviando…';
  try{
    const r=await api('anuaisCancelar',{ids:s.map(x=>x.id)});
    const msg='Olá! Sou da '+(dados.empresa||'')+'. Pedido de cancelamento '+r.pedido+' ('+r.itens.length+' aparelho'+(r.itens.length>1?'s':'')+'):\n'+r.itens.map(x=>'• '+x.nome+' · '+(x.chip||x.imei)).join('\n');
    $('mCanc').classList.remove('show'); sel.clear();
    await carregar();
    location.href='https://wa.me/'+WPP+'?text='+encodeURIComponent(msg);
  }catch(e){ alert(e.message||'Não consegui enviar agora. Tente de novo.') }
  finally{ b.disabled=false; b.textContent='Enviar pedido' }
};
async function carregar(){
  if(!COD){ $('conteudo').innerHTML='<div class="erro">Link incompleto. Peça o link de novo à Rastreando GPS.</div>'; return }
  try{
    dados=await api('anuaisVer');
    $('empresa').textContent=dados.empresa||'Planos anuais';
    $('sub').textContent='Planos anuais · posição em '+(dados.hoje||'');
    document.title=(dados.empresa||'Planos anuais')+' · Rastreando GPS';
    const ids=new Set(dados.itens.map(x=>x.id)); for(const i of [...sel]) if(!ids.has(i)) sel.delete(i);
    desenhar();
    $('atual').textContent='Atualizado às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ $('conteudo').innerHTML='<div class="erro">'+esc(e.message||'Não consegui carregar agora.')+'</div>'; $('rodape').hidden=true }
}
carregar();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && dados) carregar() });
</script>
</body>
</html>
